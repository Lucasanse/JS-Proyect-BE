services:
  db:
    image: postgres:16-alpine
    container_name: js_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: js_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d js_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
